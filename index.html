
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sistem Informasi Sekolah</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-image: url('background.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.logo-box {
  width: 120px;
  height: 120px;
  background-color: rgba(255,255,255,0.15);
  border-radius: 7px;
  margin-bottom: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo-box img {
  width: 110%;
  height: 120%;
  object-fit: contain;
}

.welcome-text {
  color: white;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
  text-align: center;
  margin-bottom: 20px;
}

.login-box {
  background: rgba(255,255,255,0.95);
  padding: 40px 30px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
  width: 450px;
  max-width: 90%;
  text-align: center;
}

.input-group {
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

.login-btn {
  width: 60%;
  padding: 12px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px auto;
  display: block;
  transition: 0.3s;
}

.login-btn:hover {
  background-color: #0056b3;
}

.login-btn:active {
  transform: scale(0.95);
}

.register-btn {
  background-color: #28a745;
}

.register-btn:hover {
  background-color: #1e7e34;
}

.message {
  margin-top: 15px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="logo-box">
  <img src="logosekolah.png">
</div>

<div class="welcome-text">
  <h1>Sistem Informasi Sekolah</h1>
  <h2>Selamat Datang!</h2>
</div>

<div class="login-box">

<form method="POST">
  <div class="input-group">
    <input type="text" name="username" placeholder="Username" required>
  </div>

  <div class="input-group">
    <input type="password" name="password" placeholder="Password" required>
  </div>

  <button class="login-btn" type="submit" name="login">LOGIN</button>
  <button class="login-btn register-btn" type="submit" name="register">+ TAMBAH AKUN</button>
</form>

<div class="message">
  <?= $message ?>
</div>

</div>

</body>
</html>
